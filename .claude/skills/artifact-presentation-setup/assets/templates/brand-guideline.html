<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--__FONTS__-->
<style>
/*__THEME__*/
/*__SHARED_CSS__*/
.layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 28px; margin-top: 22px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.nav { position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 820px) { .nav { position: static; flex-direction: row; overflow-x: auto; } }
.nav a { padding: 6px 10px; border-radius: 6px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
section.sec { scroll-margin-top: 90px; padding: 20px 22px; }
section.sec > h2 { font-size: 22px; margin-bottom: 12px; }
.lead { font-family: var(--font-display); font-size: clamp(20px, 3.2vw, 28px); line-height: 1.25; max-width: 30ch; text-wrap: balance; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.mini { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.mini h3 { font-size: 15px; margin-bottom: 4px; }
ul.tight { margin: 4px 0 0; padding-left: 18px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.sw { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--surface); text-align: left; padding: 0; }
.sw .c { height: 74px; display: flex; align-items: flex-end; padding: 8px 10px; font-family: var(--font-mono); font-size: 13px; }
.sw .i { padding: 8px 10px; font-size: 13px; }
.sw .i b { display: block; }
.do { border-left: 3px solid var(--good); } .dont { border-left: 3px solid var(--bad); }
.quote { border-left: 3px solid var(--accent); padding-left: 12px; margin: 8px 0 0; max-width: 60ch; }
.final { padding: 20px 22px; }
</style>
<div id="app"></div>
<script type="application/json" id="data">__DATA__</script>
<script>
/*__SHARED_JS__*/
(function () {
  const app = document.getElementById('app');
  const B = DATA.brand || {};
  const list = (arr) => h('ul', { class: 'tight' }, (arr || []).map((x) => h('li', null, x)));
  const ink = (hex) => { const n = parseInt(String(hex).replace('#', '').padStart(6, '0'), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#111' : '#fff'; };
  const sections = [];

  if (DATA.positioning) sections.push(['positioning', 'Positioning', () => h('div', { class: 'stack' }, h('p', { class: 'lead' }, DATA.positioning.statement),
    (DATA.positioning.differentiators || []).length ? h('div', null, h('div', { class: 'eyebrow' }, 'What sets us apart'), list(DATA.positioning.differentiators)) : null)]);
  if ((DATA.audience || []).length) sections.push(['audience', 'Audience', () => h('div', { class: 'cols' }, DATA.audience.map((a) => h('div', { class: 'mini' },
    h('h3', null, a.name), h('p', null, a.description), a.pains ? h('div', { style: 'margin-top:8px' }, h('b', null, 'Pains'), list(a.pains)) : null,
    a.desires ? h('div', { style: 'margin-top:8px' }, h('b', null, 'Wants'), list(a.desires)) : null)))]);
  if (DATA.voice) sections.push(['voice', 'Voice and tone', () => h('div', { class: 'stack' },
    h('div', { class: 'chips' }, (DATA.voice.traits || []).map((t) => h('span', { class: 'badge info' }, t))),
    h('div', { class: 'cols' }, h('div', { class: 'mini do' }, h('h3', null, 'We say'), list(DATA.voice.do)), h('div', { class: 'mini dont' }, h('h3', null, 'We avoid'), list(DATA.voice.dont))),
    (DATA.voice.sample_lines || []).map((q) => h('blockquote', { class: 'quote' }, q)))]);
  if ((DATA.products || []).length) sections.push(['products', 'Products and services', () => h('div', { class: 'cols' }, DATA.products.map((p) => h('div', { class: 'mini' },
    h('h3', null, p.name), h('p', null, p.description), p.price ? h('p', { class: 'mono muted', style: 'margin-top:6px' }, p.price) : null)))]);
  if ((DATA.offers || []).length) sections.push(['offers', 'Offers', () => h('div', { class: 'cols' }, DATA.offers.map((o) => h('div', { class: 'mini' },
    h('h3', null, o.name), h('p', null, o.description), o.cta ? h('p', { style: 'margin-top:6px' }, h('b', null, 'CTA: '), o.cta) : null)))]);
  if ((DATA.palette || []).length || (DATA.fonts || []).length) sections.push(['visual', 'Visual identity', () => h('div', { class: 'stack' },
    h('div', { class: 'swatches' }, (DATA.palette || []).map((c) => h('button', { class: 'sw', type: 'button', onclick: () => copyText(c.hex, c.hex + ' copied'), 'aria-label': 'Copy ' + c.name + ' ' + c.hex },
      h('div', { class: 'c', style: 'background:' + c.hex + ';color:' + ink(c.hex) }, c.hex), h('div', { class: 'i' }, h('b', null, c.name), h('span', { class: 'muted' }, c.role))))),
    (DATA.fonts || []).length ? h('div', { class: 'cols' }, DATA.fonts.map((f) => h('div', { class: 'mini' }, h('div', { class: 'eyebrow' }, f.role), h('h3', null, f.name), f.sample ? h('p', null, f.sample) : null))) : null)]);
  if ((DATA.prohibited || []).length) sections.push(['prohibited', 'Never say or claim', () => h('div', { class: 'mini dont' }, list(DATA.prohibited))]);

  const nav = h('nav', { class: 'nav', 'aria-label': 'Sections' }, sections.map(([id, label]) => h('a', { href: '#' + id }, label)));
  const secEls = sections.map(([id, label, render]) => h('section', { class: 'card sec', id },
    h('h2', null, label), render(), decisionWidget({ id: 'section-' + id, title: label }, { placeholder: 'Anything to change in "' + label + '"?' })));

  const whole = { id: 'guideline', title: B.name + ' brand guideline' };
  app.append(chrome(B.name ? B.name + ' brand guideline' : DATA.title, B.tagline),
    h('main', { class: 'wrap' }, h('div', { class: 'layout' }, nav,
      h('div', { class: 'stack', style: 'min-width:0' },
        B.summary ? h('section', { class: 'card sec' }, h('div', { class: 'eyebrow' }, 'In one paragraph'), h('p', { style: 'max-width:70ch;margin-top:6px' }, B.summary)) : null,
        secEls,
        h('section', { class: 'card final' }, h('h2', { style: 'font-size:20px' }, 'Overall decision'), h('p', { class: 'muted' }, 'Approve to lock this guideline for all content agents.'),
          decisionWidget(whole, { placeholder: 'Final remarks' }),
          h('div', { class: 'row', style: 'margin-top:12px' }, saveStatus(),
            h('button', { class: 'btn primary', type: 'button', onclick: () => copyText(Decisions.summary([whole].concat(sections.map(([id, l]) => ({ id: 'section-' + id, title: l }))), DATA.title), 'Summary copied') }, 'Copy summary')))))));
  Decisions.init();
})();
</script>
