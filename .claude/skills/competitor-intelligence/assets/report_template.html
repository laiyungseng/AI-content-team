<title>Competitor Intelligence Report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky bar with page tabs; page 1 = verdict sections of cards; page 2 = headline, comparison table, strategy; approval box at the foot of both. */
:root {
  --bg: #f4f6f7; --panel: #ffffff; --fg: #1b2428; --muted: #5d6b72; --line: #d9e0e3; --accent: #0b6b6b; --accent-fg: #ffffff;
  --adapt: #2457a6; --adapt-bg: #e6eefb; --copy: #1f7a4d; --copy-bg: #e2f3ea; --ignore: #5d6b72; --ignore-bg: #eceff1;
  --warn: #9a6200; --warn-bg: #fbf1dc; --danger: #b3261e;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181b; --panel: #1a2226; --fg: #e6ecee; --muted: #93a2a9; --line: #2c383d; --accent: #4cc0bd; --accent-fg: #0a1415;
    --adapt: #8db4f5; --adapt-bg: #1b2a44; --copy: #5fcf95; --copy-bg: #17332a; --ignore: #93a2a9; --ignore-bg: #232d32;
    --warn: #e0aa4a; --warn-bg: #352b14; --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181b; --panel: #1a2226; --fg: #e6ecee; --muted: #93a2a9; --line: #2c383d; --accent: #4cc0bd; --accent-fg: #0a1415;
  --adapt: #8db4f5; --adapt-bg: #1b2a44; --copy: #5fcf95; --copy-bg: #17332a; --ignore: #93a2a9; --ignore-bg: #232d32;
  --warn: #e0aa4a; --warn-bg: #352b14; --danger: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); margin: 0; padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
.sub { color: var(--muted); font: 12px var(--mono); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; font: inherit; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
h2 { font-size: 16px; margin: 26px 0 4px; font-weight: 600; }
.lead { color: var(--muted); margin: 0 0 12px; max-width: 70ch; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.thumb { aspect-ratio: 4 / 3; max-width: 100%; background: var(--ignore-bg); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 12px var(--mono); color: var(--muted); }
.meta b { color: var(--fg); font-weight: 500; }
.badge { display: inline-block; border-radius: 4px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
.badge.adapt { background: var(--adapt-bg); color: var(--adapt); } .badge.copy { background: var(--copy-bg); color: var(--copy); } .badge.ignore { background: var(--ignore-bg); color: var(--ignore); }
.badge.flag { background: var(--warn-bg); color: var(--warn); }
.cap { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.reason { margin: 0; overflow-wrap: anywhere; }
details summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
details p { margin: 6px 0 0; font-size: 13px; overflow-wrap: anywhere; } details b { font-weight: 600; }
.dec { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); align-items: center; }
select, input[type=text], textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; min-width: 0; }
.dec input[type=text] { flex: 1 1 120px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.callout { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 14px 16px; margin-top: 14px; max-width: 78ch; overflow-wrap: anywhere; }
.tbl { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 8px 12px; }
td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
td.dim { font-weight: 600; white-space: nowrap; }
.who { font-weight: 600; } .who.ours { color: var(--copy); } .who.theirs { color: var(--adapt); } .who.similar, .who.unclear { color: var(--muted); }
.strat { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.strat > div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.strat h3 { font-size: 14px; margin: 0 0 4px; } .strat p { margin: 0 0 6px; overflow-wrap: anywhere; } .do { font-weight: 600; color: var(--accent); }
ul.plain { margin: 6px 0 0; padding-left: 18px; }
.unread { background: var(--warn-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-top: 18px; font-size: 13px; }
.approve { position: sticky; bottom: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px 8px 0 0; margin-top: 28px; padding: 10px 14px;
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.approve input[type=text] { flex: 1 1 200px; }
button.act { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 7px 14px; font: inherit; font-weight: 500; cursor: pointer; }
button.act.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.state { font: 12px var(--mono); color: var(--muted); }
.empty { color: var(--muted); padding: 12px 0; }
[hidden] { display: none !important; }
</style>

<div class="wrap">
  <header class="bar">
    <div><h1 id="title">Competitor Intelligence Report</h1><div class="sub" id="sub"></div></div>
    <div class="seg" role="group" aria-label="Report page">
      <button id="tab-1" type="button" aria-pressed="true">1 Scraped content</button>
      <button id="tab-2" type="button" aria-pressed="false">2 Us vs them</button>
    </div>
  </header>

  <main id="p1">
    <div class="filters" id="filters" aria-label="Filter by platform"></div>
    <div id="groups"></div>
    <div class="unread" id="unread" hidden></div>
    <p class="state" id="trim" hidden></p>
  </main>

  <main id="p2" hidden>
    <div class="callout" id="headline"></div>
    <h2>Side by side</h2>
    <p class="lead" id="counts"></p>
    <div class="tbl"><table><thead><tr><th>Area</th><th>Ours</th><th>Theirs</th><th>Stronger</th><th>Why</th><th>How we do it</th></tr></thead><tbody id="rows"></tbody></table></div>
    <h2>Strategy</h2>
    <div class="strat" id="strategy"></div>
    <h2>Positioning</h2>
    <div class="callout" id="positioning"></div>
    <h2>Our baseline</h2>
    <div id="ours" class="lead"></div>
  </main>

  <div class="approve" id="approve">
    <strong>Your decision</strong>
    <input type="text" id="rcomment" placeholder="Comment (optional)" aria-label="Comment on the whole report">
    <button class="act primary" id="btn-approve" type="button">Approve report</button>
    <button class="act" id="btn-revise" type="button">Request changes</button>
    <span class="state" id="rstate" role="status"></span>
    <button class="act" id="btn-copy" type="button" hidden>Copy summary</button>
  </div>
</div>

<script>
const DATA = __REPORT_JSON__;
const LABEL = { adapt: "Adapt", copy: "Copy", ignore: "Ignore" };
const PLAT = { instagram: "Instagram", tiktok: "TikTok", meta: "Meta ad", xhs: "XHS" };
const $ = (id) => document.getElementById(id);
const decisions = {}; let dbRef = null, filter = "all", reportDec = null;
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v); });
  kids.flat().forEach((k) => e.append(k)); return e;
}
const n = (v) => (v === "" || v == null ? null : Number(v));
const fmt = (v) => (n(v) == null ? "n/a" : Number(v).toLocaleString());
function metaLine(c) {
  const bits = [];
  if (c.type === "ad") bits.push(["started", c.date], ["metrics", "not public for ads"]);
  else { bits.push(["date", c.date]); if (n(c.views) != null) bits.push(["views", fmt(c.views)]); if (n(c.likes) != null) bits.push(["likes", fmt(c.likes)]); if (n(c.comments) != null) bits.push(["comments", fmt(c.comments)]); if (n(c.saves) != null) bits.push(["saves", fmt(c.saves)]); if (n(c.shares) != null) bits.push(["shares", fmt(c.shares)]); }
  return el("div", { class: "meta" }, bits.map(([k, v]) => el("span", {}, k + " ", el("b", {}, v))));
}
function ratioText(c) { if (c.ratio == null) return ""; return c.ratio.toFixed(1) + "x their usual reach"; }
function finalVerdict(c) { return (decisions[c.did] && decisions[c.did].verdict) || c.verdict; }
function card(c) {
  const fv = finalVerdict(c);
  const dec = el("div", { class: "dec" },
    el("select", { id: "v-" + c.did, "aria-label": "Your verdict", onchange: (e) => save(c, e.target.value, $("c-" + c.did).value) },
      Object.keys(LABEL).map((k) => el("option", { value: k, selected: k === fv }, LABEL[k]))),
    el("input", { type: "text", id: "c-" + c.did, placeholder: "Comment", "aria-label": "Comment", value: (decisions[c.did] && decisions[c.did].comment) || "", onchange: () => save(c, $("v-" + c.did).value, $("c-" + c.did).value) }));
  return el("article", { class: "card" },
    el("div", { class: "thumb" }, c.image ? el("img", { src: c.image, alt: "", loading: "lazy" }) : "no image"),
    el("div", { class: "body" },
      el("div", { class: "meta" }, el("span", { class: "badge " + c.verdict }, "Suggested: " + LABEL[c.verdict]), c.anomaly ? el("span", { class: "badge flag" }, "one-off, check first") : "",
        el("span", {}, el("b", {}, c.account), " | " + PLAT[c.platform])),
      metaLine(c),
      c.ratio != null ? el("div", { class: "meta" }, el("b", {}, ratioText(c))) : "",
      el("p", { class: "reason" }, c.reason),
      el("div", { class: "cap" }, c.caption),
      (c.hook || c.why || c.how) ? el("details", {}, el("summary", {}, "Hook, why it works, how to use it"),
        c.hook ? el("p", {}, el("b", {}, "Hook: "), c.hook) : "", c.why ? el("p", {}, el("b", {}, "Why it works: "), c.why) : "", c.how ? el("p", {}, el("b", {}, "How to use it: "), c.how) : "",
        el("p", { class: "state" }, "confidence: " + c.confidence)) : "",
      c.permalink ? el("a", { href: c.permalink, target: "_blank", rel: "noopener" }, "Open original") : "",
      dec));
}
function renderCards() {
  const g = $("groups"); g.replaceChildren();
  const cards = DATA.cards.filter((c) => filter === "all" || c.platform === filter);
  ["copy", "adapt", "ignore"].forEach((v) => {
    const list = cards.filter((c) => finalVerdict(c) === v);
    const blurb = { copy: "Worked, and the idea fits us as is. Reuse the structure with our content.", adapt: "Worked, but needs rebuilding for our offer and voice.", ignore: "Do not act on these." }[v];
    g.append(el("h2", {}, LABEL[v] + " (" + list.length + ")"), el("p", { class: "lead" }, blurb),
      list.length ? el("div", { class: "grid" }, list.map(card)) : el("div", { class: "empty" }, "Nothing here."));
  });
}
function renderFilters() {
  const f = $("filters"); f.replaceChildren();
  const plats = ["all", ...new Set(DATA.cards.map((c) => c.platform))];
  plats.forEach((p) => f.append(el("button", { class: "chip", type: "button", "aria-pressed": p === filter, onclick: () => { filter = p; renderFilters(); renderCards(); } }, p === "all" ? "All platforms" : PLAT[p])));
}
function renderUnread() {
  const u = $("unread"); const list = DATA.unread;
  if (!list.length) return; u.hidden = false;
  u.append(el("strong", {}, "Could not read"), el("ul", { class: "plain" }, list.map((x) => el("li", {}, x.account + " (" + PLAT[x.platform] + ", " + x.owner + "): " + x.status + ". " + x.note))));
}
function renderPage2() {
  const c = DATA.comparison;
  $("headline").textContent = c.headline;
  $("counts").textContent = c.postCounts;
  const rows = $("rows");
  c.rows.forEach((r) => rows.append(el("tr", {}, el("td", { class: "dim" }, r.dimension), el("td", {}, r.ours), el("td", {}, r.theirs),
    el("td", {}, el("span", { class: "who " + r.stronger }, { ours: "Ours", theirs: "Theirs", similar: "Similar", unclear: "Unclear" }[r.stronger])), el("td", {}, r.why), el("td", {}, r.how))));
  const s = $("strategy");
  c.strategy.forEach((x) => s.append(el("div", {}, el("h3", {}, x.title), el("p", {}, x.detail), el("p", { class: "do" }, "Do next: " + x.doNext))));
  const p = c.positioning, pe = $("positioning");
  pe.append(el("p", {}, p.statement));
  if (p.gaps && p.gaps.length) pe.append(el("strong", {}, "Gaps competitors leave"), el("ul", { class: "plain" }, p.gaps.map((g) => el("li", {}, g))));
  if (p.avoid && p.avoid.length) pe.append(el("strong", {}, "Avoid"), el("ul", { class: "plain" }, p.avoid.map((g) => el("li", {}, g))));
  const o = $("ours");
  if (DATA.ours) { o.append(el("p", {}, DATA.ours.summary)); if (DATA.ours.missing) o.append(el("p", { class: "state" }, DATA.ours.missing)); }
  else o.textContent = "No baseline from our own accounts in this run.";
}
function tab(i) { $("p1").hidden = i !== 1; $("p2").hidden = i !== 2; $("tab-1").setAttribute("aria-pressed", i === 1); $("tab-2").setAttribute("aria-pressed", i === 2); }
$("tab-1").addEventListener("click", () => tab(1)); $("tab-2").addEventListener("click", () => tab(2));
$("title").textContent = DATA.meta.project + " competitor report";
$("sub").textContent = "run " + DATA.meta.run + " | " + DATA.meta.counts.competitor + " competitor items" + (DATA.meta.counts.ours ? ", " + DATA.meta.counts.ours + " of ours" : "");
if (DATA.meta.trimmed.length) { $("trim").hidden = false; $("trim").textContent = "Showing the strongest items only. Trimmed: " + DATA.meta.trimmed.join(", ") + ". Everything collected is kept in items.tsv."; }

async function save(c, verdict, comment) {
  decisions[c.did] = { item: c.id, verdict, comment };
  if (dbRef) { try { await dbRef.collection("decisions").doc(c.did).set({ item: c.id, verdict, comment, at: new Date().toISOString() }); $("rstate").textContent = "saved"; } catch (e) { $("rstate").textContent = "could not save: " + (e && e.code || "error"); } }
  else { $("rstate").textContent = "saved in this window only: use Copy summary"; $("btn-copy").hidden = false; }
  renderCards();
}
async function decide(kind) {
  reportDec = { kind, comment: $("rcomment").value };
  if (dbRef) { try { await dbRef.collection("decisions").doc("report").set({ item: "report", decision: kind, comment: $("rcomment").value, at: new Date().toISOString() }); $("rstate").textContent = kind === "approve" ? "approval saved: tell Claude you are done" : "change request saved: tell Claude you are done"; } catch (e) { $("rstate").textContent = "could not save: " + (e && e.code || "error"); } }
  else { $("rstate").textContent = "not saved: use Copy summary"; $("btn-copy").hidden = false; }
}
$("btn-approve").addEventListener("click", () => decide("approve")); $("btn-revise").addEventListener("click", () => decide("revise"));
$("btn-copy").addEventListener("click", async () => {
  const lines = ["Decisions for: " + DATA.meta.project + " " + DATA.meta.run];
  DATA.cards.forEach((c) => { const v = finalVerdict(c); const cm = decisions[c.did] && decisions[c.did].comment; if (v !== c.verdict || cm) lines.push("- " + c.id + " (" + c.account + "): " + v + (cm ? " | " + cm : "")); });
  lines.push("- report: " + (reportDec ? reportDec.kind + (reportDec.comment ? " | " + reportDec.comment : "") : "pending"));
  const t = lines.join("\n");
  try { await navigator.clipboard.writeText(t); $("rstate").textContent = "summary copied"; } catch (e) { const ta = el("textarea", { rows: 6, "aria-label": "Summary" }); ta.value = t; $("approve").append(ta); ta.select(); }
});
renderFilters(); renderCards(); renderUnread(); renderPage2();

(async () => {
  let db = null; try { db = window.claude && (await window.claude.use("db")); } catch (e) { db = null; }
  if (!db) { $("rstate").textContent = "shared storage unavailable: use Copy summary"; $("btn-copy").hidden = false; return; }
  dbRef = db;
  db.collection("decisions").onSnapshot((snap) => {
    snap.docs.forEach((d) => { const x = d.data(); if (!x) return; if (d.id === "report") { reportDec = { kind: x.decision, comment: x.comment || "" }; $("rstate").textContent = "report: " + x.decision; if (x.comment) $("rcomment").value = x.comment; } else decisions[d.id] = { item: x.item, verdict: x.verdict, comment: x.comment || "" }; });
    renderCards();
  }, () => { $("rstate").textContent = "storage error: reload the page"; });
})();
</script>
