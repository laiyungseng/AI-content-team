<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>{{BASE_CSS}}</style>
<style>
/* 01-cover v2 — Editorial cover with ghost watermark + corner brackets + serif headline
   Slots: TAG, WATERMARK_WORD (single English word, max ~6 chars), HEADLINE_BEFORE, HEADLINE_ACCENT, HEADLINE_AFTER, SUBTITLE */
.page--01 { padding: 0; }
.page--01 .watermark--cover { font-size: 580px; top: -100px; right: -80px; line-height: 0.78; }
.page--01 .content {
  position: absolute;
  top: 240px;
  left: 80px;
  right: 80px;
  bottom: 200px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.page--01 .eyebrow { margin-bottom: 50px; }
.page--01 h1 {
  font-family: var(--font-serif);
  font-size: 124px;
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--brand-dark);
  margin-bottom: 0;
}
.page--01 .accent { color: var(--brand-primary); }
.page--01 .divider { margin: 40px 0 50px; width: 140px; height: 4px; }
.page--01 .sub {
  font-family: var(--font-sans);
  font-size: 32px;
  color: var(--brand-body);
  font-weight: 400;
  line-height: 1.55;
  max-width: 800px;
}
</style></head>
<body><div class="page page--01">
  <span class="watermark watermark--cover">{{WATERMARK_WORD}}</span>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <div class="header-bar">
    <span class="handle">{{HANDLE}}</span>
    <span class="page-num">{{PAGE_NUM}}</span>
  </div>

  <div class="content">
    <div class="eyebrow">{{TAG}}</div>
    <h1>{{HEADLINE_BEFORE}}<span class="accent">{{HEADLINE_ACCENT}}</span>{{HEADLINE_AFTER}}</h1>
    <hr class="divider">
    <p class="sub">{{SUBTITLE}}</p>
  </div>

  <div class="footer-bar">
    <span class="slogan">{{SLOGAN_FOOTER}}</span>
    <span class="swipe">SWIPE →</span>
  </div>
</div></body></html>
