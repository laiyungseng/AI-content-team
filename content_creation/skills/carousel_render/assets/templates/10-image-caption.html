<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>{{BASE_CSS}}</style>
<style>
/* 10-image-caption — UGC 真实照片 + 说明文字
   Slots: IMAGE_PATH (必, 用户提供绝对路径, render.py 会 base64 embed → IMAGE_DATA)
          OVERLAY ('dark' / 'light' / 'none', 默认 dark)
          TAG (optional), HEADLINE, CAPTION (optional 小注解) */
.page--10 { position: relative; overflow: hidden; background: var(--brand-dark); color: white; }
.page--10 .bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.page--10 .overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,20,25,0.2) 0%, rgba(15,20,25,0.85) 75%, rgba(15,20,25,0.95) 100%); z-index: 1; }
.page--10 .content { position: relative; z-index: 2; padding: 100px 80px 220px 80px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.page--10 .tag-pill { display: inline-block; align-self: flex-start; background: var(--brand-primary); color: var(--brand-dark); padding: 12px 28px; border-radius: 100px; font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-bottom: 36px; text-transform: uppercase; }
.page--10 .headline { font-size: 84px; font-weight: 900; line-height: 1.1; color: white; margin-bottom: 28px; max-width: 940px; }
.page--10 .caption { font-size: 30px; line-height: 1.5; color: rgba(255,255,255,0.85); max-width: 880px; font-weight: 400; }
.page--10 .logo-bar { position: absolute; bottom: 56px; left: 80px; right: 80px; display: flex; justify-content: space-between; align-items: center; color: white; z-index: 5; font-size: 24px; font-weight: 500; letter-spacing: 0.04em; }
.page--10 .logo-bar .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--brand-primary); margin-right: 12px; }
.page--10 .logo-bar .page-num { color: rgba(255,255,255,0.6); letter-spacing: 0.15em; font-variant-numeric: tabular-nums; }
</style></head>
<body><div class="page page--10">
  <img class="bg-img" src="{{IMAGE_DATA}}" alt="">
  <div class="overlay"></div>
  <div class="content">
    <div class="tag-pill">{{TAG}}</div>
    <h2 class="headline">{{HEADLINE}}</h2>
    <p class="caption">{{CAPTION}}</p>
  </div>
  <div class="logo-bar">
    <span><span class="dot"></span>{{HANDLE}}</span>
    <span class="page-num">{{PAGE_NUM}}</span>
  </div>
</div></body></html>
