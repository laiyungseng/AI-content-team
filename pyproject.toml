[project]
name = "ai-content-team"
version = "0.1.0"
description = "AI content intelligence and generation agent team (workspace tooling)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",
    "pandas>=2.2",
    "pillow>=10.0",
]

[dependency-groups]
# Install with: uv sync --group media
media = [
    "yt-dlp",
    "faster-whisper",
]

[tool.uv]
package = false
